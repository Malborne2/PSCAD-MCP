[project]
name = "pscad-mcp"
version = "0.1.0"
description = "MCP server exposing PSCAD's Automation Library to AI agents"
requires-python = ">=3.9"
dependencies = [
    "mcp>=2.0",
    "mhi-pscad>=3.1.3",
    "mhi-psout>=2.0.0",
    "pywin32>=306; platform_system=='Windows'",
]

[project.scripts]
pscad-mcp = "pscad_mcp.server:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
